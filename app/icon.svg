<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Mike's Train Tracker</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16305F"/>
      <stop offset="1" stop-color="#0C1B38"/>
    </linearGradient>
  </defs>
  <rect id="bg" width="512" height="512" rx="112" fill="url(#g)"/>
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="#E3B53A" stroke-width="10"/>
  <!-- M for Mike, drawn like a gold panel lamp line -->
  <path d="M92 196 V100 L140 160 L188 100 V196" stroke="#E3B53A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- junction: main line with a branch peeling off -->
  <path d="M76 318 H436" stroke="#C9D3E8" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M206 318 C 280 318, 306 214, 382 214 H436" stroke="#C9D3E8" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- occupied section lit in on-time blue, with its headcode box -->
  <path d="M96 318 H186" stroke="#8FB0F0" stroke-width="20" stroke-linecap="round" fill="none"/>
  <rect x="88" y="236" width="108" height="52" rx="12" fill="#8FB0F0"/>
  <rect x="106" y="254" width="16" height="16" rx="4" fill="#102347"/>
  <rect x="134" y="254" width="16" height="16" rx="4" fill="#102347"/>
  <rect x="162" y="254" width="16" height="16" rx="4" fill="#102347"/>
  <!-- signal: post and gold-rimmed head showing clear -->
  <path d="M334 318 V 352" stroke="#8FA0C8" stroke-width="8" stroke-linecap="round"/>
  <rect x="304" y="346" width="60" height="96" rx="30" fill="#0B0D12" stroke="#E3B53A" stroke-width="7"/>
  <circle cx="334" cy="376" r="14" fill="#3A1E26"/>
  <circle cx="334" cy="412" r="22" fill="#3FCF8E" opacity="0.25"/>
  <circle cx="334" cy="412" r="14" fill="#3FCF8E"/>
</svg>
