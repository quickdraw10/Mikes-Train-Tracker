<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train Tracker">
<title>Mike's Train Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body data-theme="dark" data-tab="map">
  <header class="brand">
    <img src="icon.svg" width="34" height="34" alt="">
    <div class="wordmark"><span class="mikes">Mike's</span><span class="tt">Train Tracker</span></div>
  </header>

  <section id="mapview" class="mapview" aria-label="Map of trains">
    <div id="map"></div>
    <div class="map-top">
      <div class="map-search">
        <label class="search" for="map-q">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="map-q" type="search" placeholder="Search a station or town" autocomplete="off" enterkeyhint="search">
        </label>
        <ul id="map-results" class="results" hidden></ul>
      </div>
      <div id="areas" class="areas" hidden></div>
      <div id="map-count" class="map-count" aria-live="polite"></div>
    </div>
    <div class="map-buttons">
      <button id="zoom-in" class="mbtn" aria-label="Zoom in"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoom-out" class="mbtn" aria-label="Zoom out"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="locate" class="mbtn gold" aria-label="Show where I am"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3L3 10.5l7.5 3 3 7.5z"/></svg></button>
    </div>
  </section>

  <section id="boardsview" class="page" hidden></section>
  <main id="view" class="page" aria-live="polite" hidden></main>

  <nav class="tabs" aria-label="Views">
    <button class="tab" data-tab="map" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      Map
    </button>
    <button class="tab" data-tab="boards">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h6M7 14h10"/></svg>
      Boards
    </button>
    <button class="tab" data-tab="panel">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h18M3 16h18M9 8l6 8"/></svg>
      Panel
    </button>
    <button class="tab" data-tab="route">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v18M16 3v18"/><circle cx="8" cy="8" r="2"/><circle cx="16" cy="15" r="2"/></svg>
      Route
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
